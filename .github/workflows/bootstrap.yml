name: bootstrap

on:
  workflow_dispatch: # only manually trigger this workflow
    inputs:
      version:
        description: 'version (git tag without the `v` prefix)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4 # v3.1.0
        with:
          jvm: temurin:19
      - name: cs bootstrap
        run: cs bootstrap com.michaelpollmeier::scala-repl-pp:${{ inputs.version }} -o srp
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          files: srp
          fail_on_unmatched_files: true
