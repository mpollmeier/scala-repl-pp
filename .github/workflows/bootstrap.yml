name: bootstrap

on:
  workflow_dispatch: # only manually trigger this workflow
    inputs:
      version:
        description: 'version (git tag without the `v` prefix)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1
        with:
          jvm: temurin:19
      - name: cs bootstrap
        run: cs bootstrap com.michaelpollmeier::scala-repl-pp:${{ inputs.version }} -o srp
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          files: srp
          fail_on_unmatched_files: true
